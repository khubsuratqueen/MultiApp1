name: multi_apps_mck
description: "Multi Apps MCK – Luxury app cloner with premium UI (2026)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local storage (lightweight, fast)
  hive_flutter: ^1.1.0

  # Secure storage (PIN, tokens)
  flutter_secure_storage: ^9.2.2

  # Biometrics
  local_auth: ^2.3.0

  # PIN input (animated, luxury-styled)
  pinput: ^5.0.0

  # Hashing (SHA-256 for PIN storage)
  crypto: ^3.0.3

  # Logging
  logger: ^2.4.0

  # Dependency injection
  get_it: ^8.0.2

  # Lottie animations
  lottie: ^3.1.2

  # Premium subscriptions – RevenueCat (cross-platform, no custom backend needed)
  purchases_flutter: ^9.13.1

  # Analytics and Crash Reporting
  firebase_core: ^2.27.0
  firebase_crashlytics: ^3.4.19

  # Utilities
  image_picker: ^1.1.2          # Gallery & camera
  path_provider: ^2.1.5         # App documents directory
  path: ^1.9.0                  # Path manipulation
  file_picker: ^8.1.2           # Pick .json file for restore
  share_plus: ^10.0.3           # Share exported .json file
  webview_flutter: ^4.9.0       # Official webview base
  webview_flutter_wkwebview: ^3.15.0 # iOS engine
  url_launcher: ^6.3.0          # external links
  shared_preferences: ^2.3.2    # Local persistence
  flutter_windowmanager: ^0.2.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  hive_generator: ^2.0.1        # Generates ClonedAppAdapter from @HiveType
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
